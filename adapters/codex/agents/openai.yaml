interface:
  display_name: "Goal Loop"
  short_description: "Durable cross-engine backlog execution loop"
  default_prompt: "Invoke $goal-loop to take durable ownership of a backlog, milestone, or work list; every selected issue is executed through the installed agent-pipeline skill ($pipeline) from planning to pipeline:ready-to-deploy. Reach for Codex /goal only when that ownership must be durable and autonomous; use a normal prompt for bounded single tasks. Native goal bootstrap (operator-owned prerequisite): start native /goal, then invoke $goal-loop. goal-loop does not invoke /goal or $goal-loop on your behalf, and does not detect, attest to, or control native-goal state; native goal status and completion are owned by the host/session."
