interface:
  display_name: "Goal Loop"
  short_description: "Durable cross-engine backlog execution loop"
  default_prompt: "For durable autonomous ownership of a backlog, milestone, or work list, start native /goal first, then invoke $goal-loop; every selected issue is executed through the installed agent-pipeline skill ($pipeline) from planning to pipeline:ready-to-deploy. Native /goal status and completion are owned by the host session, not detected, verified, or controlled by this skill; goal-loop only asserts its own durable done definition plus a final reconciliation pass, and the operator completes native /goal afterward. Use a normal prompt for bounded single tasks, outside native Goal mode and outside goal-loop."
