interface:
  display_name: "Goal Loop"
  short_description: "Durable cross-engine backlog execution loop"
  default_prompt: "For durable autonomous ownership of a backlog, milestone, or work list, start native /goal, then invoke $goal-loop; every selected issue is executed through the installed agent-pipeline skill ($pipeline) from planning to pipeline:ready-to-deploy. Use a normal prompt for bounded single tasks, outside native Goal mode and outside goal-loop. Native /goal status and completion are owned by the host/session and are never independently verified or controlled by this skill; goal-loop's only assertable completion is its own durable done definition plus final reconciliation, after which the operator completes native /goal."
